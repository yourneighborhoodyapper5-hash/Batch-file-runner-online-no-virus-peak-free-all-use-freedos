<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Red Dash</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        margin: 0;
        background: #f5f3f0;
        color: #242424;
        font: 16px system-ui, sans-serif;
      }
      main { width: min(100% - 24px, 1100px); text-align: center; }
      h1 { margin: 0 0 6px; color: #e60012; font-size: 30px; }
      p { margin: 0 0 16px; color: #555; font-size: 13px; }
      canvas {
        width: 100%;
        max-height: 70dvh;
        border: 4px solid #e60012;
        border-radius: 6px;
        background: #fff;
        touch-action: none;
      }
      button {
        min-height: 38px;
        margin-top: 12px;
        padding: 0 22px;
        border: 0;
        border-radius: 4px;
        background: #e60012;
        color: #fff;
        font: 700 13px system-ui, sans-serif;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Red Dash</h1>
      <p>Move with ← → or A / D. Avoid the blocks and catch the stars.</p>
      <canvas id="game" width="600" height="360" aria-label="Red Dash game"></canvas>
      <div><button id="start" type="button">Start game</button></div>
    </main>
    <script>
      const canvas = document.querySelector("#game");
      const context = canvas.getContext("2d");
      const startButton = document.querySelector("#start");
      const keys = new Set();
      let player;
      let objects;
      let score;
      let frame;
      let running = false;

      function reset() {
        player = { x: canvas.width / 2 - 13, y: canvas.height - 42, width: 26, height: 26 };
        objects = [];
        score = 0;
        frame = 0;
        running = true;
        startButton.textContent = "Restart game";
        draw();
      }

      function draw() {
        context.fillStyle = "#fff";
        context.fillRect(0, 0, canvas.width, canvas.height);
        context.fillStyle = "#e60012";
        context.fillRect(player.x, player.y, player.width, player.height);
        context.fillStyle = "#242424";
        context.font = "bold 15px system-ui";
        context.fillText(`SCORE  ${score}`, 14, 24);
        for (const object of objects) {
          context.fillStyle = object.star ? "#e6a700" : "#333";
          if (object.star) {
            context.beginPath();
            context.arc(object.x + 10, object.y + 10, 9, 0, Math.PI * 2);
            context.fill();
          } else {
            context.fillRect(object.x, object.y, 22, 22);
          }
        }
      }

      function tick() {
        if (!running) return;
        frame++;
        if (keys.has("ArrowLeft") || keys.has("a")) player.x -= 5;
        if (keys.has("ArrowRight") || keys.has("d")) player.x += 5;
        player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
        if (frame % 34 === 0) objects.push({
          x: Math.random() * (canvas.width - 22),
          y: -24,
          star: Math.random() < 0.22
        });
        for (const object of objects) object.y += 2.4 + Math.min(score / 50, 4);
        const hit = objects.find(object => object.x < player.x + player.width &&
          object.x + 22 > player.x && object.y < player.y + player.height &&
          object.y + 22 > player.y);
        if (hit?.star) {
          score++;
          objects = objects.filter(object => object !== hit);
        } else if (hit) {
          running = false;
          startButton.textContent = `Game over — ${score} points. Play again`;
        }
        if (running) {
          objects = objects.filter(object => object.y < canvas.height);
          draw();
          requestAnimationFrame(tick);
        }
      }

      window.addEventListener("keydown", event => {
        if (["ArrowLeft", "ArrowRight"].includes(event.key)) event.preventDefault();
        keys.add(event.key.toLowerCase());
      });
      window.addEventListener("keyup", event => keys.delete(event.key.toLowerCase()));
      startButton.addEventListener("click", () => { reset(); tick(); });
      reset();
      running = false;
    </script>
  </body>
</html>
